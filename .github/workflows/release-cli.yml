name: Release CLI

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build platform executables
        run: bun run build:cli:all

      - name: Package release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release

          package_tarball() {
            local source_path="$1"
            local archive_name="$2"
            local staging_dir
            staging_dir="$(mktemp -d)"
            cp "${source_path}" "${staging_dir}/qckpage"
            tar -C "${staging_dir}" -czf "release/${archive_name}" qckpage
            rm -rf "${staging_dir}"
          }

          package_tarball dist/qckpage-linux-x64 qckpage-linux-x64.tar.gz
          package_tarball dist/qckpage-linux-aarch64 qckpage-linux-aarch64.tar.gz
          package_tarball dist/qckpage-darwin-x64 qckpage-darwin-x64.tar.gz
          package_tarball dist/qckpage-darwin-aarch64 qckpage-darwin-aarch64.tar.gz

          cp dist/qckpage-windows-x64.exe qckpage.exe
          zip -j release/qckpage-windows-x64.zip qckpage.exe
          rm qckpage.exe

          cp install.sh install.ps1 release/
          (
            cd release
            sha256sum \
              qckpage-linux-x64.tar.gz \
              qckpage-linux-aarch64.tar.gz \
              qckpage-darwin-x64.tar.gz \
              qckpage-darwin-aarch64.tar.gz \
              qckpage-windows-x64.zip > SHA256SUMS
          )

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release/* --generate-notes --verify-tag
